  <rect x="1.75" y="2.75" width="38.5" height="38.5" rx="10.25" stroke="url(#lf-edge)" stroke-width="0.85"/>
  <path d="M10 32 L10 12 L20 12 L20 22 L28 12 L34 12 L24 24 L34 32 L28 32 L20 26 L20 32 Z" fill="url(#lf-mark)"/>
